name: CI

on:
  - push
  - pull_request

jobs:
  test:
    runs-on: ${{ matrix.platform }}

    strategy:
      matrix:
        platform:
          - ubuntu-26.04
          - ubuntu-26.04-arm
        cc:
          - gcc
          - clang
        make_target:
          - check
          - distcheck
        configure_flags:
          - ''
        protocol:
          - default
          - RESP2
          - RESP3
        tls:
          - 'false'
          - 'true'
        exclude:
          # Only exercise protocol & TLS combinations with 'make check':
          # 'make distcheck' already runs the test suite once internally
          # using the defaults.
          - make_target: distcheck
            protocol: RESP2
          - make_target: distcheck
            protocol: RESP3
          - make_target: distcheck
            tls: 'true'
        # Code coverage ('make lcov') is disabled in this branch because
        # Varnish Enterprise makes the reports useless:
        #   - When running as root (as here), the varnishd child drops
        #     privileges (e.g. to 'vcache') and cannot create the .gcda files
        #     in the build dir.
        #   - The varnishd child terminates using _exit() instead of exit(),
        #     so the VMOD's destructors never run and libgcov never dumps the
        #     counters. Most coverage is silently lost (~18% vs. ~54% when
        #     using Varnish Cache).
        # include:
        #   - platform: ubuntu-26.04
        #     cc: gcc
        #     make_target: lcov
        #     configure_flags: --enable-code-coverage
        #     protocol: default
        #     tls: 'false'

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # docker build \
      #   --build-arg VCC='${{ matrix.cc }}' \
      #   --tag libvmod-redis-dev \
      #   .
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: libvmod-redis-dev
          build-args: VCC=${{ matrix.cc }}
          cache-from: type=gha,scope=${{ matrix.platform }}-${{ matrix.cc }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}-${{ matrix.cc }}

      - name: Build & test VMOD
        run: |
          docker run \
            --rm \
            --entrypoint bash \
            --volume ${{ github.workspace }}:/workspace \
            --workdir /workspace \
            libvmod-redis-dev \
            -c '\
              set -e; \
              git config --global --add safe.directory /workspace; \
              ./autogen.sh; \
              CC="${{ matrix.cc }}" ./configure --prefix=/usr ${{ matrix.configure_flags }}; \
              make -j4; \
              PROTOCOL="${{ matrix.protocol }}" TLS="${{ matrix.tls }}" make ${{ matrix.make_target }} -j1'

      # See above why code coverage is disabled in this branch.
      # - name: Push code coverage
      #   if: ${{ matrix.make_target == 'lcov' }}
      #   uses: codecov/codecov-action@v6
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}
      #     fail_ci_if_error: true

      - name: Show test report
        if: ${{ failure() }}
        run: |
          cat src/test-suite.log || exit 0
